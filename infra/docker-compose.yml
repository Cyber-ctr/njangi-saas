services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: njangi
      POSTGRES_USER: njangi
      POSTGRES_PASSWORD: njangi
    volumes:
      - njangi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U njangi -d njangi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - njangi_redis:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://njangi:njangi@db:5432/njangi
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: development-only-compose-secret-do-not-use-in-production
      CORS_ORIGINS: http://localhost:4173
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4173:8080"

volumes:
  njangi_pg:
  njangi_redis:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: njangi
      POSTGRES_USER: njangi
      POSTGRES_PASSWORD: njangi
    ports:
      - "5432:5432"
    volumes:
      - njangi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U njangi -d njangi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - njangi_redis:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://njangi:njangi@db:5432/njangi
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: replace-this-in-production
      CORS_ORIGINS: http://localhost:4173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "4173:4173"

volumes:
  njangi_pg:
  njangi_redis:
